{% extends "base.html" %}
{% block title %}Forgot password - ShopHub{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Forgot your password?</h1>
  <p class="sub">Enter your account email and we'll send you a link to reset it.</p>
  <form method="post" novalidate>
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Email <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required autofocus></label>
    <button class="btn block" type="submit">Send reset link</button>
  </form>
  <p class="sub center"><a href="{{ url_for('login') }}">&larr; Back to log in</a></p>
</div>
{% endblock %}
