{% extends "base.html" %}
{% block title %}Reset password - ShopHub{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Choose a new password</h1>
  <p class="sub">This link works once and expires after 1 hour.</p>
  <form method="post" data-confirm novalidate>
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>New password <input type="password" name="password" id="password" placeholder="Enter new password" autocomplete="new-password" required autofocus></label>
    <small id="strength"></small>
    <label>Confirm new password <input type="password" name="confirm_password" placeholder="Repeat new password" autocomplete="new-password" required></label>
    <button class="btn block" type="submit">Update password</button>
  </form>
</div>
{% endblock %}
